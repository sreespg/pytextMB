[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pytexMB"
version = "1.0.0"
description = "Build a manuscript's PDF, Word copy, and LaTeX package from Markdown"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/sreespg/pytextMB"

[project.scripts]
pytexMB = "pytexMB.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The journal templates ship inside the package.
[tool.setuptools.package-data]
pytexMB = ["docx_front.tex", "templates/*/*"]
